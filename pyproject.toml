[project]
name = "budgetgate"
requires-python = ">=3.14"
version = "0.1.0"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/budgetcore-py/Cargo.toml"
python-source = "python"
module-name = "budgetgate._budgetcore"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ty>=0.0.107",
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["budgetgate"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["assert_never\\(", "\\.\\.\\."]

[tool.ruff]
extend-exclude = ["python/budgetgate/_budgetcore.pyi"]
