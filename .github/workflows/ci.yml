name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup component add rustfmt clippy llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test with coverage
        run: cargo llvm-cov -p budgetcore --fail-under-lines 90

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Ruff lint
        run: uvx ruff check .
      - name: Ruff format
        run: uvx ruff format --check .
      - name: Type check
        run: uv run ty check
      - name: Build extension
        run: uv sync
      - name: Check type stubs match the extension
        run: uv run --with mypy python -m mypy.stubtest budgetgate._budgetcore
      - name: Test
        run: uv run pytest --cov --cov-fail-under=90
